# explore.html is a committed build artefact - viewer.html with the payload
# inlined - and nothing regenerates it on push. So the two can drift, and they
# have: an explore.html built before an edit to viewer.html silently serves the
# older page. The header links - the Microsoft Store link and the coffee link -
# are exactly the kind of small block that would go missing that way and not be
# noticed.
#
# This checks they are in the page that is actually served, byte for byte as
# viewer.html now writes them. No secrets, no network.

name: Site

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: The header links are in the page that is served
        run: python3 .github/check_site.py
